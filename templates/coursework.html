{% extends "base.html" %}
{% set breadcrumb = "Course Work" %}
{% block content %}
<div class="tab-bar">
  <span class="tab-item active">รายการงาน</span>
  <div class="tab-spacer"></div>
  <div class="tab-utils">
    <button class="icon-btn" title="Refresh" onclick="location.reload()">
      <span class="material-icons-outlined">refresh</span>
    </button>
  </div>
</div>

<div class="content-area">
  <div class="filter-row">
    <span style="font-size:14px;color:var(--color-text-secondary)">{{ works|length }} งาน</span>
  </div>

  <div class="section-block">
    <div class="section-header">
      <span class="section-title">งานทั้งหมด</span>
      <span class="material-icons-outlined chevron">expand_more</span>
    </div>
    <div class="list-rows">
      {% for w in works %}
      <div class="list-row">
        <div class="row-icon-badge" style="background:#1A73E8">
          <span class="material-icons-outlined">description</span>
        </div>
        <span class="row-label">{{ w.title }}</span>
        <span class="row-meta" style="font-style:normal;font-size:12px">{{ w.id }}</span>
        <div class="row-actions">
          <a href="/submissions?course_id={{ course_id }}&coursework_id={{ w.id }}" class="icon-btn" title="ดูการส่งงาน">
            <span class="material-icons-outlined">fact_check</span>
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
